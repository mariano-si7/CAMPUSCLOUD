services:
  #===============================================================
  #==========================1. PostgreSQL 16
  #===============================================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud_net
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #===============================================================
  #==========================2. Pgadmin 4
  #===============================================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-cloud
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud_net

  #===============================================================
  #==========================3. SQL Server 2025
  #===============================================================
  sqlserver-cloud:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - campuscloud_net
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  #===============================================================
  #==========================4. MongoDB Community Server
  #===============================================================
  mongo-cloud:
    image: mongodb/mongodb-community-server:9.0-ubi9-slim
    container_name: campuscloud-mongodb
    restart: always
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGODB_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campuscloud_net
    healthcheck:
      test: [
        "CMD-SHELL",
        "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

#===============================================================
#==========================VOLÚMENES
#===============================================================
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME}

  pgadmin_data:
    external: true
    name: ${PGADMIN_VOLUME}
    
  sqlserver_data:
    external: true
    name: ${SQLSERVER_VOLUME}

  mongo_data:
    external: true
    name: ${MONGO_VOLUME}

#===============================================================
#==========================RED
#===============================================================
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
